[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [".venv", "frontend"]

[tool.ruff.lint]
# Syntax, undefined names, unused imports/locals: no wholesale style rewrite.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Reproduction scripts add backend/ to sys.path before application imports.
"scripts/verify_*.py" = ["E402"]
"backend/tests/conftest.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
files = ["backend/app/agent/actions.py", "backend/app/agent/providers", "backend/app/rag/trust.py", "backend/app/tools/hygiene.py", "backend/app/schemas/health.py"]
follow_imports = "silent"
check_untyped_defs = true
warn_unused_ignores = true
